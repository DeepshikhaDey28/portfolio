<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Water Glow Filter -->
    <filter id="aqua-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#0c4a6e" flood-opacity="0.35"/>
    </filter>

    <!-- Body Gradients -->
    <linearGradient id="ab-body-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="30%" stop-color="#7dd3fc"/>
      <stop offset="75%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Shell / Database Gradient -->
    <linearGradient id="ab-shell-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="40%" stop-color="#78350f"/>
      <stop offset="85%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Belly Plate Gradient -->
    <linearGradient id="ab-belly-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="60%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <!-- Database Rim Glow -->
    <linearGradient id="db-rim-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="102" cy="174" rx="60" ry="14" fill="rgba(12, 74, 110, 0.35)"/>

  <!-- SPIRAL WATER TAIL (Behind Body) -->
  <g>
    <path d="M125 132 C155 140 178 122 170 98 C162 82 144 88 140 102 C138 112 146 120 154 116 C158 114 160 108 156 104" 
          fill="#38bdf8" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
    <path d="M140 104 Q148 116 158 112" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Floating Water Bubbles -->
    <circle cx="172" cy="88" r="3.5" fill="#bae6fd" opacity="0.8"/>
    <circle cx="180" cy="102" r="2.5" fill="#38bdf8" opacity="0.7"/>
    <circle cx="166" cy="128" r="2" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- BACK DATABASE TURTLE SHELL -->
  <!-- Shell Rim (Hexagonal Outer Ring) -->
  <ellipse cx="118" cy="115" rx="44" ry="40" 
           fill="url(#ab-shell-grad)" stroke="#1e293b" stroke-width="3.5"/>
  <ellipse cx="118" cy="115" rx="38" ry="34" 
           fill="none" stroke="#fef08a" stroke-width="2.5" opacity="0.85"/>

  <!-- Database Cylindrical Disk Grooves -->
  <ellipse cx="118" cy="102" rx="32" ry="14" fill="none" stroke="#38bdf8" stroke-width="2.2"/>
  <ellipse cx="118" cy="116" rx="32" ry="14" fill="none" stroke="#38bdf8" stroke-width="2.2"/>
  <ellipse cx="118" cy="130" rx="32" ry="14" fill="none" stroke="#38bdf8" stroke-width="2.2"/>

  <!-- Hexagonal Database Core Pattern -->
  <polygon points="118,100 128,106 128,118 118,124 108,118 108,106" 
           fill="#0c4a6e" stroke="#7dd3fc" stroke-width="1.8"/>

  <!-- FEET & LEGS -->
  <!-- Left Leg -->
  <path d="M64 142 C54 142 46 150 48 162 C50 170 60 173 72 171 C84 169 86 156 80 146 Z" 
        fill="url(#ab-body-grad)" stroke="#0369a1" stroke-width="2.5"/>
  <circle cx="54" cy="169" r="3" fill="#ffffff" stroke="#0369a1" stroke-width="1"/>
  <circle cx="62" cy="172" r="3" fill="#ffffff" stroke="#0369a1" stroke-width="1"/>
  <circle cx="70" cy="170" r="3" fill="#ffffff" stroke="#0369a1" stroke-width="1"/>

  <!-- Right Leg -->
  <path d="M110 144 C104 156 106 168 118 171 C130 173 140 169 142 160 C144 148 136 142 124 142 Z" 
        fill="url(#ab-body-grad)" stroke="#0369a1" stroke-width="2.5"/>
  <circle cx="120" cy="170" r="3" fill="#ffffff" stroke="#0369a1" stroke-width="1"/>
  <circle cx="128" cy="172" r="3" fill="#ffffff" stroke="#0369a1" stroke-width="1"/>
  <circle cx="136" cy="169" r="3" fill="#ffffff" stroke="#0369a1" stroke-width="1"/>

  <!-- TORSO (Chubby Blue Body) -->
  <path d="M62 102 C50 118 54 152 90 154 C126 152 130 118 120 102 C114 94 106 90 90 90 C74 90 66 94 62 102 Z" 
        fill="url(#ab-body-grad)" stroke="#0369a1" stroke-width="3" filter="url(#aqua-glow-filter)"/>

  <!-- Segmented Cream Belly (Turtle Plastron Plates) -->
  <path d="M72 108 C66 122 70 146 90 146 C110 146 114 122 108 108 C102 100 78 100 72 108 Z" 
        fill="url(#ab-belly-grad)" stroke="#ca8a04" stroke-width="2"/>
  <!-- Plastron Grooves -->
  <line x1="72" y1="124" x2="108" y2="124" stroke="#ca8a04" stroke-width="1.8"/>
  <line x1="90" y1="102" x2="90" y2="146" stroke="#ca8a04" stroke-width="1.8"/>

  <!-- ARMS -->
  <!-- Left Flipper Arm -->
  <path d="M60 110 C46 116 42 126 50 130 C58 132 64 124 66 116 Z" 
        fill="url(#ab-body-grad)" stroke="#0369a1" stroke-width="2.2"/>
  <circle cx="46" cy="124" r="2" fill="#ffffff"/>
  <circle cx="49" cy="128" r="2" fill="#ffffff"/>

  <!-- Right Flipper Arm -->
  <path d="M120 110 C132 116 136 126 128 130 C120 132 114 124 112 116 Z" 
        fill="url(#ab-body-grad)" stroke="#0369a1" stroke-width="2.2"/>
  <circle cx="134" cy="124" r="2" fill="#ffffff"/>
  <circle cx="131" cy="128" r="2" fill="#ffffff"/>

  <!-- HEAD -->
  <ellipse cx="90" cy="70" rx="40" ry="36" 
           fill="url(#ab-body-grad)" stroke="#0369a1" stroke-width="3" filter="url(#aqua-glow-filter)"/>

  <!-- Big Aquatic Squirtle Eyes -->
  <!-- Left Eye -->
  <ellipse cx="74" cy="64" rx="9.5" ry="13" fill="#082f49" stroke="#0c4a6e" stroke-width="1.5"/>
  <ellipse cx="74" cy="65" rx="7" ry="10" fill="#0284c7"/>
  <ellipse cx="74" cy="67" rx="4.5" ry="7" fill="#38bdf8"/>
  <circle cx="71" cy="59" r="3.5" fill="#ffffff"/>
  <circle cx="77" cy="71" r="1.8" fill="#ffffff"/>

  <!-- Right Eye -->
  <ellipse cx="106" cy="64" rx="9.5" ry="13" fill="#082f49" stroke="#0c4a6e" stroke-width="1.5"/>
  <ellipse cx="106" cy="65" rx="7" ry="10" fill="#0284c7"/>
  <ellipse cx="106" cy="67" rx="4.5" ry="7" fill="#38bdf8"/>
  <circle cx="103" cy="59" r="3.5" fill="#ffffff"/>
  <circle cx="109" cy="71" r="1.8" fill="#ffffff"/>

  <!-- Cute Snout & Nostrils -->
  <circle cx="87" cy="74" r="1.2" fill="#0369a1"/>
  <circle cx="93" cy="74" r="1.2" fill="#0369a1"/>

  <!-- Happy Turtle Smile -->
  <path d="M82 80 Q90 89 98 80" stroke="#0c4a6e" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Soft Water Cheek Blush -->
  <circle cx="64" cy="74" r="4.5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="116" cy="74" r="4.5" fill="#38bdf8" opacity="0.6"/>
</svg>
