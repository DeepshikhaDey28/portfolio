<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ab-skin-grad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="85%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="ab-shell-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="40%" stop-color="#b45309"/>
      <stop offset="85%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="ab-plastron-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="ab-water-swirl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="ab-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#082f49" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="64" cy="116" rx="38" ry="8" fill="#1e293b" opacity="0.35"/>

  <!-- Curled Water Wave Tail (Behind) -->
  <g id="tail-assembly">
    <!-- Big swirly water droplet tail -->
    <path d="M40 84 Q20 86 16 70 Q12 52 30 48 Q38 46 42 54 Q44 64 36 68 Q28 70 30 76 Q34 80 44 80 Z" fill="url(#ab-skin-grad)" stroke="#0369a1" stroke-width="2"/>
    <!-- Swirl Groove inside tail -->
    <path d="M26 60 Q22 56 28 52 Q34 50 36 56" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
    <!-- Splash Droplets -->
    <circle cx="14" cy="46" r="2.5" fill="url(#ab-water-swirl)"/>
    <circle cx="22" cy="40" r="1.5" fill="url(#ab-water-swirl)"/>
  </g>

  <!-- Shell Carapace (Back Profile) -->
  <g id="shell-assembly" filter="url(#ab-shadow)">
    <!-- Shell Dome -->
    <ellipse cx="74" cy="80" rx="34" ry="28" fill="url(#ab-shell-grad)" stroke="#451a03" stroke-width="2.5"/>
    <!-- Thick Cream Shell Rim / Collar -->
    <path d="M46 94 Q74 112 104 90 Q108 82 102 78 Q74 100 48 84 Z" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <!-- Carapace Hexagonal Grooves -->
    <polygon points="74,62 88,68 88,82 74,88 60,82 60,68" fill="none" stroke="#fde68a" stroke-width="2" stroke-linejoin="round"/>
    <line x1="74" y1="62" x2="74" y2="54" stroke="#fde68a" stroke-width="2"/>
    <line x1="88" y1="68" x2="98" y2="64" stroke="#fde68a" stroke-width="2"/>
    <line x1="88" y1="82" x2="100" y2="86" stroke="#fde68a" stroke-width="2"/>
    <line x1="74" y1="88" x2="74" y2="98" stroke="#fde68a" stroke-width="2"/>
    <line x1="60" y1="82" x2="50" y2="86" stroke="#fde68a" stroke-width="2"/>
    <line x1="60" y1="68" x2="50" y2="64" stroke="#fde68a" stroke-width="2"/>
  </g>

  <!-- Turtle Body & Front -->
  <g id="body-assembly">
    <!-- Back Left Leg -->
    <rect x="42" y="94" width="14" height="20" rx="7" fill="#0369a1" stroke="#075985" stroke-width="1.8"/>
    <path d="M43 112 Q46 108 49 112 M49 112 Q52 108 55 112" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Front Left Foot -->
    <rect x="66" y="98" width="16" height="20" rx="8" fill="url(#ab-skin-grad)" stroke="#0369a1" stroke-width="1.8"/>
    <path d="M68 116 Q71 110 74 116 M74 116 Q77 110 80 116" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none"/>

    <!-- Front Plastron (Belly Plate) -->
    <path d="M46 66 Q42 84 48 98 Q60 104 68 98 Q66 80 60 66 Z" fill="url(#ab-plastron-grad)" stroke="#b45309" stroke-width="2"/>
    <!-- Horizontal Grooves on Plastron -->
    <path d="M46 76 Q54 80 62 76 M46 86 Q54 90 64 86" fill="none" stroke="#d97706" stroke-width="1.5"/>

    <!-- Left Arm Forward -->
    <path d="M44 70 Q30 76 34 84 Q40 88 48 78 Z" fill="url(#ab-skin-grad)" stroke="#0369a1" stroke-width="1.8"/>
    <circle cx="31" cy="81" r="1.5" fill="#ffffff"/>

    <!-- Right Arm / Swimming Stance -->
    <path d="M72 74 Q84 76 86 84 Q80 90 70 84 Z" fill="url(#ab-skin-grad)" stroke="#0369a1" stroke-width="1.8"/>
    <circle cx="86" cy="80" r="1.5" fill="#ffffff"/>

    <!-- Large Rounded Turtle Head -->
    <circle cx="56" cy="38" r="22" fill="url(#ab-skin-grad)" stroke="#0369a1" stroke-width="2"/>

    <!-- Big Sparkling Aquamarine Eyes -->
    <!-- Left Eye -->
    <ellipse cx="44" cy="34" rx="5" ry="7.5" fill="#78350f" stroke="#451a03" stroke-width="1"/>
    <ellipse cx="44" cy="35" rx="3.8" ry="5.8" fill="#b45309"/>
    <circle cx="43" cy="32" r="2" fill="#ffffff"/>

    <!-- Right Eye -->
    <ellipse cx="64" cy="34" rx="6" ry="8.5" fill="#78350f" stroke="#451a03" stroke-width="1"/>
    <ellipse cx="64" cy="35" rx="4.8" ry="6.8" fill="#b45309"/>
    <circle cx="62" cy="31" r="2.5" fill="#ffffff"/>
    <circle cx="66" cy="37" r="1.2" fill="#ffffff"/>

    <!-- Cute Smiling Beak / Snout -->
    <path d="M50 46 Q56 52 64 46" stroke="#075985" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M52 47 Q56 54 62 47" fill="#ef4444"/>

    <!-- Dynamic Hydro Splash Ring -->
    <path d="M28 32 Q20 22 24 16 Q30 20 32 26" fill="none" stroke="url(#ab-water-swirl)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="20" cy="18" r="2" fill="#38bdf8"/>
    <circle cx="28" cy="12" r="1.5" fill="#ffffff"/>
  </g>
</svg>
