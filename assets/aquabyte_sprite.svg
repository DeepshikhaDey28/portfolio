<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="aqua-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38bdf8"/>
    </filter>
    <linearGradient id="aqua-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="db-shell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <!-- Swirl Water Tail -->
  <path d="M110 105 C135 110 148 95 140 80 C130 68 118 78 115 88 Z" fill="#38bdf8" stroke="#0369a1" stroke-width="2.5" filter="url(#aqua-glow)"/>
  <path d="M128 86 Q135 94 125 100" stroke="#ffffff" stroke-width="2" fill="none"/>

  <!-- Back Database Shell (Cylinder turtle shell) -->
  <ellipse cx="88" cy="92" rx="36" ry="32" fill="url(#db-shell)" stroke="#0c4a6e" stroke-width="3" filter="url(#aqua-glow)"/>
  <ellipse cx="88" cy="80" rx="28" ry="12" fill="none" stroke="#7dd3fc" stroke-width="2.5"/>
  <ellipse cx="88" cy="94" rx="28" ry="12" fill="none" stroke="#7dd3fc" stroke-width="2.5"/>
  <ellipse cx="88" cy="108" rx="28" ry="12" fill="none" stroke="#7dd3fc" stroke-width="2.5"/>

  <!-- Feet -->
  <ellipse cx="58" cy="132" rx="12" ry="7" fill="#0284c7"/>
  <ellipse cx="94" cy="132" rx="12" ry="7" fill="#0284c7"/>
  <circle cx="53" cy="133" r="2" fill="#fff"/>
  <circle cx="58" cy="135" r="2" fill="#fff"/>
  <circle cx="89" cy="133" r="2" fill="#fff"/>
  <circle cx="94" cy="135" r="2" fill="#fff"/>

  <!-- Chubby Blue Torso -->
  <ellipse cx="68" cy="96" rx="26" ry="24" fill="url(#aqua-body)" stroke="#0369a1" stroke-width="2.5"/>

  <!-- Soft Blue Belly -->
  <ellipse cx="62" cy="100" rx="18" ry="16" fill="#bae6fd" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Little Hands -->
  <ellipse cx="46" cy="98" rx="7" ry="5" fill="#38bdf8" stroke="#0369a1" stroke-width="1.5"/>
  <ellipse cx="82" cy="102" rx="7" ry="5" fill="#38bdf8" stroke="#0369a1" stroke-width="1.5"/>

  <!-- Head -->
  <ellipse cx="58" cy="58" rx="26" ry="24" fill="url(#aqua-body)" stroke="#0369a1" stroke-width="2.5"/>

  <!-- Big Aquatic Eyes -->
  <ellipse cx="49" cy="54" rx="7" ry="9" fill="#0c4a6e"/>
  <ellipse cx="69" cy="54" rx="7" ry="9" fill="#0c4a6e"/>
  <ellipse cx="49" cy="53" rx="5" ry="7" fill="#0284c7"/>
  <ellipse cx="69" cy="53" rx="5" ry="7" fill="#0284c7"/>
  <circle cx="47" cy="50" r="2.5" fill="#ffffff"/>
  <circle cx="67" cy="50" r="2.5" fill="#ffffff"/>

  <!-- Cute Smile -->
  <path d="M54 68 Q59 74 64 68" stroke="#0c4a6e" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Bubble drop cheek blush -->
  <circle cx="42" cy="62" r="3" fill="#38bdf8" opacity="0.6"/>
  <circle cx="74" cy="62" r="3" fill="#38bdf8" opacity="0.6"/>
</svg>
