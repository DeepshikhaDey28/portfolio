<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Shading Gradients -->
    <linearGradient id="fc-body-grad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="85%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="fc-belly-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="fc-flame-core" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="35%" stop-color="#f97316"/>
      <stop offset="70%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="fc-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <filter id="fc-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#431407" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="64" cy="116" rx="36" ry="8" fill="#1e293b" opacity="0.35"/>

  <!-- Tail Curve & Blazing Flame (Behind Body) -->
  <g id="tail-assembly">
    <!-- Tail base -->
    <path d="M72 88 Q96 92 102 74 Q106 62 102 52 Q97 58 90 70 Q84 80 68 84 Z" fill="url(#fc-body-grad)" stroke="#9a3412" stroke-width="2"/>
    <!-- Tail Flame Glow -->
    <circle cx="106" cy="46" r="24" fill="url(#fc-glow)"/>
    <!-- Outer Flame -->
    <path d="M100 60 Q112 56 116 42 Q120 28 108 24 Q106 34 100 36 Q98 28 92 32 Q96 46 100 60 Z" fill="#ef4444" opacity="0.9"/>
    <!-- Mid Flame -->
    <path d="M102 54 Q112 48 114 36 Q110 30 104 32 Q102 24 96 30 Q96 42 102 54 Z" fill="#f97316"/>
    <!-- Core Blazing Flame -->
    <path d="M103 50 Q110 44 110 36 Q106 32 103 34 Q100 28 97 34 Q98 44 103 50 Z" fill="url(#fc-flame-core)"/>
    <!-- Spark Particles -->
    <circle cx="118" cy="22" r="2" fill="#fef08a"/>
    <circle cx="92" cy="20" r="1.5" fill="#fef08a"/>
    <circle cx="106" cy="14" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Main Body Silhouette -->
  <g id="body-assembly" filter="url(#fc-shadow)">
    <!-- Back Foot (Left) -->
    <ellipse cx="44" cy="108" rx="10" ry="6" fill="#c2410c"/>
    <path d="M36 108 Q38 104 42 108 M42 108 Q44 104 48 108 M48 108 Q50 104 54 108" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Front Foot (Right) -->
    <ellipse cx="78" cy="110" rx="12" ry="7" fill="url(#fc-body-grad)" stroke="#9a3412" stroke-width="1.8"/>
    <!-- White Toenails -->
    <path d="M70 112 Q72 107 76 112 M76 112 Q78 107 82 112 M82 112 Q84 107 88 112" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none"/>

    <!-- Torso / Chubby Body -->
    <path d="M42 58 Q34 76 42 98 Q50 110 68 110 Q84 110 86 94 Q88 74 80 58 Z" fill="url(#fc-body-grad)" stroke="#9a3412" stroke-width="2"/>

    <!-- Cream Belly & Chest Patch -->
    <path d="M52 64 Q46 80 50 102 Q60 108 72 106 Q76 96 74 82 Q72 68 62 64 Z" fill="url(#fc-belly-grad)" stroke="#d97706" stroke-width="1.5"/>

    <!-- Left Arm -->
    <path d="M40 70 Q32 74 34 82 Q38 86 44 80 Z" fill="#ea580c" stroke="#9a3412" stroke-width="1.5"/>
    <circle cx="33" cy="81" r="1.5" fill="#ffffff"/>

    <!-- Head Shape -->
    <path d="M40 44 Q36 22 56 16 Q76 12 84 26 Q92 38 86 52 Q78 62 60 62 Q42 62 40 44 Z" fill="url(#fc-body-grad)" stroke="#9a3412" stroke-width="2"/>

    <!-- Cute Snout & Nostril -->
    <path d="M72 40 Q84 42 86 48 Q82 54 72 52 Z" fill="url(#fc-body-grad)"/>
    <circle cx="76" cy="42" r="1" fill="#7c2d12"/>

    <!-- Right Arm / Paws Forward -->
    <path d="M74 72 Q86 74 88 80 Q84 88 74 82 Z" fill="url(#fc-body-grad)" stroke="#9a3412" stroke-width="1.5"/>
    <!-- Claw Tips -->
    <circle cx="88" cy="78" r="1.5" fill="#ffffff"/>
    <circle cx="86" cy="83" r="1.5" fill="#ffffff"/>

    <!-- Big Anime Eyes -->
    <!-- Left Eye -->
    <ellipse cx="50" cy="36" rx="4.5" ry="7" fill="#0f172a" stroke="#7c2d12" stroke-width="1"/>
    <ellipse cx="50" cy="37" rx="3.5" ry="5.5" fill="#0284c7"/>
    <circle cx="49" cy="34" r="2" fill="#ffffff"/>
    <circle cx="51" cy="39" r="1" fill="#ffffff"/>

    <!-- Right Eye (Main Focus) -->
    <ellipse cx="68" cy="35" rx="5.5" ry="8.5" fill="#0f172a" stroke="#7c2d12" stroke-width="1"/>
    <ellipse cx="68" cy="36" rx="4.5" ry="6.5" fill="#0284c7"/>
    <circle cx="66" cy="32" r="2.5" fill="#ffffff"/>
    <circle cx="70" cy="38" r="1.2" fill="#ffffff"/>

    <!-- Happy Confident Smile -->
    <path d="M60 48 Q68 54 74 46" stroke="#7c2d12" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M64 49 Q68 56 72 48" fill="#ef4444"/>
    <!-- Cheek Blush -->
    <ellipse cx="76" cy="46" rx="4" ry="2.5" fill="#ea580c" opacity="0.6"/>
  </g>
</svg>
