<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="jp-body-grad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fdf2f8"/>
      <stop offset="60%" stop-color="#fbcfe8"/>
      <stop offset="90%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </radialGradient>
    <radialGradient id="jp-eye-grad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <filter id="jp-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#831843" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="64" cy="116" rx="36" ry="8" fill="#1e293b" opacity="0.35"/>

  <!-- Cat Ears -->
  <g id="ears-assembly">
    <!-- Left Ear -->
    <polygon points="34,42 22,14 48,26" fill="#f472b6" stroke="#db2777" stroke-width="2.2" stroke-linejoin="round"/>
    <polygon points="32,38 26,20 42,28" fill="#1e293b"/>

    <!-- Right Ear -->
    <polygon points="94,42 106,14 80,26" fill="#f472b6" stroke="#db2777" stroke-width="2.2" stroke-linejoin="round"/>
    <polygon points="96,38 102,20 86,28" fill="#1e293b"/>
  </g>

  <!-- Spherical Balloon Body -->
  <g id="body-assembly" filter="url(#jp-shadow)">
    <!-- Main Pink Balloon Body -->
    <circle cx="64" cy="70" r="44" fill="url(#jp-body-grad)" stroke="#db2777" stroke-width="2.5"/>

    <!-- Forehead Swirl Tuft of Hair -->
    <path d="M58 32 C58 20 72 16 76 26 C80 34 68 40 62 38 C54 36 56 46 64 48" fill="none" stroke="#db2777" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M58 32 C58 20 72 16 76 26 C80 34 68 40 62 38" fill="url(#jp-body-grad)"/>

    <!-- Huge Sparkling Aquamarine Anime Eyes -->
    <!-- Left Eye -->
    <circle cx="44" cy="66" r="14" fill="url(#jp-eye-grad)" stroke="#0369a1" stroke-width="2"/>
    <circle cx="44" cy="66" r="8.5" fill="#0c4a6e"/>
    <!-- Specular Sparkle Highlights -->
    <circle cx="40" cy="61" r="4.5" fill="#ffffff"/>
    <circle cx="48" cy="72" r="2" fill="#ffffff"/>
    <circle cx="41" cy="71" r="1.2" fill="#7dd3fc"/>

    <!-- Right Eye -->
    <circle cx="84" cy="66" r="14" fill="url(#jp-eye-grad)" stroke="#0369a1" stroke-width="2"/>
    <circle cx="84" cy="66" r="8.5" fill="#0c4a6e"/>
    <!-- Specular Sparkle Highlights -->
    <circle cx="80" cy="61" r="4.5" fill="#ffffff"/>
    <circle cx="88" cy="72" r="2" fill="#ffffff"/>
    <circle cx="81" cy="71" r="1.2" fill="#7dd3fc"/>

    <!-- Tiny Singing Open Mouth -->
    <ellipse cx="64" cy="84" rx="4.5" ry="6" fill="#be185d" stroke="#831843" stroke-width="1.2"/>
    <ellipse cx="64" cy="86" rx="3" ry="3.5" fill="#f43f5e"/>

    <!-- Plump Little Paws Forward -->
    <ellipse cx="38" cy="98" rx="7" ry="5" fill="#fbcfe8" stroke="#db2777" stroke-width="1.8"/>
    <ellipse cx="90" cy="98" rx="7" ry="5" fill="#fbcfe8" stroke="#db2777" stroke-width="1.8"/>

    <!-- Little Feet Below -->
    <ellipse cx="50" cy="112" rx="9" ry="6" fill="#f472b6" stroke="#db2777" stroke-width="2"/>
    <ellipse cx="78" cy="112" rx="9" ry="6" fill="#f472b6" stroke="#db2777" stroke-width="2"/>

    <!-- Melodic Floating Sparkles / Musical Aura -->
    <polygon points="102,46 104,50 108,51 104,53 102,57 100,53 96,51 100,50" fill="#f43f5e"/>
    <circle cx="24" cy="52" r="2" fill="#38bdf8"/>
    <circle cx="108" cy="38" r="1.5" fill="#fde047"/>
  </g>
</svg>
