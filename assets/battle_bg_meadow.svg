<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Sky Gradient (Pastel Aqua / Mint) -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fc9b1"/>
      <stop offset="30%" stop-color="#72dcc8"/>
      <stop offset="65%" stop-color="#a6f1e3"/>
      <stop offset="100%" stop-color="#d6fdf6"/>
    </linearGradient>

    <!-- Scanline pattern -->
    <pattern id="scanlines" width="10" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="10" height="2" fill="#ffffff" fill-opacity="0.14"/>
      <rect x="0" y="2" width="10" height="2" fill="transparent"/>
    </pattern>

    <!-- Distant Horizon Hill Gradient -->
    <linearGradient id="hillGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bdf36f"/>
      <stop offset="100%" stop-color="#9fe64e"/>
    </linearGradient>

    <!-- Meadow Floor Gradient (Bright Pastel Green) -->
    <linearGradient id="meadowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9ec5a"/>
      <stop offset="15%" stop-color="#8fdf43"/>
      <stop offset="40%" stop-color="#71ce2e"/>
      <stop offset="70%" stop-color="#55ba1d"/>
      <stop offset="100%" stop-color="#41a711"/>
    </linearGradient>

    <!-- Perspective field horizontal striping -->
    <pattern id="fieldBands" width="100" height="12" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="100" height="6" fill="#ffffff" fill-opacity="0.05"/>
      <rect x="0" y="6" width="100" height="6" fill="#000000" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Sky Layer -->
  <rect x="0" y="0" width="800" height="185" fill="url(#skyGrad)"/>
  <rect x="0" y="0" width="800" height="185" fill="url(#scanlines)"/>

  <!-- Distant Rolling Hills / Trees at Horizon -->
  <path d="M 0,185 Q 90,172 190,178 Q 290,184 390,170 Q 490,158 590,170 Q 690,182 800,174 L 800,186 L 0,186 Z" fill="url(#hillGrad1)"/>
  <line x1="0" y1="185" x2="800" y2="185" stroke="#e0fcad" stroke-width="2.5"/>

  <!-- Meadow Floor -->
  <rect x="0" y="186" width="800" height="264" fill="url(#meadowGrad)"/>
  <rect x="0" y="186" width="800" height="264" fill="url(#fieldBands)"/>

  <!-- Soft Horizon Field perspective bands -->
  <rect x="0" y="186" width="800" height="8" fill="#d0f98e" opacity="0.6"/>
  <rect x="0" y="202" width="800" height="10" fill="#b0ef6b" opacity="0.4"/>
  <rect x="0" y="226" width="800" height="14" fill="#8edc4a" opacity="0.3"/>
  <rect x="0" y="260" width="800" height="18" fill="#6bc830" opacity="0.25"/>
  <rect x="0" y="310" width="800" height="24" fill="#4ea81a" opacity="0.2"/>
</svg>
