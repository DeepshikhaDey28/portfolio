<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3eb39a"/>
      <stop offset="25%" stop-color="#5ec9b3"/>
      <stop offset="55%" stop-color="#8ce4d0"/>
      <stop offset="85%" stop-color="#c1f7eb"/>
      <stop offset="100%" stop-color="#dafcf4"/>
    </linearGradient>

    <!-- Scanline pattern -->
    <pattern id="scanlines" width="10" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="10" height="2" fill="#ffffff" fill-opacity="0.12"/>
      <rect x="0" y="2" width="10" height="2" fill="transparent"/>
    </pattern>

    <!-- Distant Mountain Gradient -->
    <linearGradient id="hillGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8f27a"/>
      <stop offset="100%" stop-color="#93de50"/>
    </linearGradient>

    <!-- Mid Hills Gradient -->
    <linearGradient id="hillGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#83d745"/>
      <stop offset="100%" stop-color="#60be2e"/>
    </linearGradient>

    <!-- Meadow Perspective Gradient -->
    <linearGradient id="meadowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9be45e"/>
      <stop offset="15%" stop-color="#7cd244"/>
      <stop offset="35%" stop-color="#5ebd33"/>
      <stop offset="60%" stop-color="#46a724"/>
      <stop offset="85%" stop-color="#34931a"/>
      <stop offset="100%" stop-color="#247a12"/>
    </linearGradient>

    <!-- Subtle field stripes pattern -->
    <pattern id="fieldStripes" width="100" height="8" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="100" height="4" fill="#ffffff" fill-opacity="0.04"/>
      <rect x="0" y="4" width="100" height="4" fill="#000000" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Sky Layer -->
  <rect x="0" y="0" width="800" height="195" fill="url(#skyGrad)"/>
  <rect x="0" y="0" width="800" height="195" fill="url(#scanlines)"/>

  <!-- Distant Rolling Hills / Trees -->
  <path d="M 0,195 Q 80,180 170,186 Q 260,192 350,178 Q 440,165 530,176 Q 620,188 710,180 Q 760,175 800,182 L 800,196 L 0,196 Z" fill="url(#hillGrad1)"/>
  <path d="M 0,195 Q 60,188 130,184 Q 210,180 290,188 Q 380,182 460,187 Q 550,183 640,189 Q 720,185 800,191 L 800,196 L 0,196 Z" fill="url(#hillGrad2)" opacity="0.8"/>

  <!-- Horizon Light Border Line -->
  <line x1="0" y1="195" x2="800" y2="195" stroke="#d4fbb2" stroke-width="2"/>

  <!-- Meadow Floor -->
  <rect x="0" y="196" width="800" height="254" fill="url(#meadowGrad)"/>
  <rect x="0" y="196" width="800" height="254" fill="url(#fieldStripes)"/>

  <!-- Perspective Horizon Field Bands (Emerald GBA Style) -->
  <rect x="0" y="196" width="800" height="8" fill="#c4f886" opacity="0.6"/>
  <rect x="0" y="210" width="800" height="10" fill="#a4e966" opacity="0.4"/>
  <rect x="0" y="232" width="800" height="12" fill="#84d94b" opacity="0.35"/>
  <rect x="0" y="262" width="800" height="16" fill="#65c635" opacity="0.3"/>
  <rect x="0" y="306" width="800" height="20" fill="#49ad25" opacity="0.25"/>
  <rect x="0" y="362" width="800" height="24" fill="#329218" opacity="0.2"/>
</svg>
