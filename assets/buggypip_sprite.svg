<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bp-duck-grad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="80%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="bp-bill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bp-psychic-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="bp-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#713f12" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="64" cy="116" rx="36" ry="8" fill="#1e293b" opacity="0.35"/>

  <!-- Radiating Psychic Confusion Energy Rings (Around Head) -->
  <g id="psychic-rings">
    <ellipse cx="64" cy="42" rx="42" ry="16" fill="none" stroke="url(#bp-psychic-ring)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.85"/>
    <ellipse cx="64" cy="38" rx="52" ry="20" fill="none" stroke="url(#bp-psychic-ring)" stroke-width="1.8" stroke-dasharray="12 8" opacity="0.6"/>
    <!-- Glitch Digital Pixels drifting -->
    <rect x="24" y="26" width="4" height="4" fill="#38bdf8"/>
    <rect x="100" y="24" width="5" height="5" fill="#f43f5e"/>
    <rect x="18" y="44" width="3" height="3" fill="#d946ef"/>
    <rect x="106" y="46" width="4" height="4" fill="#facc15"/>
  </g>

  <!-- 3 Head Hairs -->
  <g id="hairs">
    <path d="M64 26 Q62 10 58 6" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M65 25 Q68 12 72 8" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M64 25 Q64 12 64 6" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Duck Body Assembly -->
  <g id="body-assembly" filter="url(#bp-shadow)">
    <!-- Webbed Feet -->
    <ellipse cx="46" cy="112" rx="14" ry="7" fill="url(#bp-bill-grad)" stroke="#b45309" stroke-width="1.8"/>
    <ellipse cx="82" cy="112" rx="14" ry="7" fill="url(#bp-bill-grad)" stroke="#b45309" stroke-width="1.8"/>

    <!-- Chubby Torso -->
    <ellipse cx="64" cy="84" rx="30" ry="26" fill="url(#bp-duck-grad)" stroke="#a16207" stroke-width="2"/>

    <!-- Big Round Head -->
    <circle cx="64" cy="46" r="26" fill="url(#bp-duck-grad)" stroke="#a16207" stroke-width="2"/>

    <!-- Paws Clutching Head in Confusion/Headache -->
    <!-- Left Paw on Temple -->
    <ellipse cx="38" cy="44" rx="7" ry="9" fill="url(#bp-duck-grad)" stroke="#a16207" stroke-width="1.8" transform="rotate(-20 38 44)"/>
    <path d="M34 40 Q38 38 40 44" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Right Paw on Temple -->
    <ellipse cx="90" cy="44" rx="7" ry="9" fill="url(#bp-duck-grad)" stroke="#a16207" stroke-width="1.8" transform="rotate(20 90 44)"/>
    <path d="M94 40 Q90 38 88 44" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Bewildered Black-Dot Eyes with Shimmer -->
    <!-- Left Eye -->
    <ellipse cx="50" cy="40" rx="7" ry="9" fill="#ffffff" stroke="#78350f" stroke-width="1.8"/>
    <circle cx="50" cy="40" r="3.2" fill="#0f172a"/>
    <circle cx="49" cy="38" r="1.2" fill="#ffffff"/>

    <!-- Right Eye -->
    <ellipse cx="78" cy="40" rx="7" ry="9" fill="#ffffff" stroke="#78350f" stroke-width="1.8"/>
    <circle cx="78" cy="40" r="3.2" fill="#0f172a"/>
    <circle cx="77" cy="38" r="1.2" fill="#ffffff"/>

    <!-- Long Broad Cream Duck Bill -->
    <path d="M42 54 Q64 46 86 54 Q88 66 64 68 Q40 66 42 54 Z" fill="url(#bp-bill-grad)" stroke="#b45309" stroke-width="2"/>
    <!-- Nostrils -->
    <circle cx="58" cy="54" r="1.5" fill="#78350f"/>
    <circle cx="70" cy="54" r="1.5" fill="#78350f"/>
    <!-- Bill Smile/Perplexity Line -->
    <path d="M48 60 Q64 64 80 60" stroke="#b45309" stroke-width="1.5" fill="none"/>
  </g>
</svg>
