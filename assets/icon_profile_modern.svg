<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="prof-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="0" flood-color="#1e251a" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="badge-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Modern ID Badge Container -->
  <rect x="8" y="6" width="48" height="52" rx="10" fill="url(#card-grad)" stroke="#1e251a" stroke-width="2.5" filter="url(#prof-shadow)"/>
  
  <!-- Lanyard / Badge Slot -->
  <rect x="24" y="9" width="16" height="3.5" rx="1.75" fill="#1e251a"/>
  
  <!-- Modern Avatar Circle -->
  <circle cx="32" cy="25" r="10.5" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.8"/>
  <circle cx="32" cy="22" r="4.5" fill="#4338ca"/>
  <path d="M24 33.5 C24 29 27.5 27 32 27 C36.5 27 40 29 40 33.5" stroke="#4338ca" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Identity / Code lines -->
  <rect x="17" y="39" width="30" height="3" rx="1.5" fill="#1e251a"/>
  <rect x="17" y="44" width="20" height="3" rx="1.5" fill="#64748b"/>
  <rect x="17" y="49" width="13" height="3" rx="1.5" fill="#94a3b8"/>

  <!-- Active Status Emerald Dot -->
  <circle cx="43" cy="50" r="3.5" fill="url(#badge-glow)" stroke="#ffffff" stroke-width="1.5"/>
</svg>
