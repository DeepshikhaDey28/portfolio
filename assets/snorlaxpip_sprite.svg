<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="sl-fur-grad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#0284c7"/>
      <stop offset="65%" stop-color="#0f766e"/>
      <stop offset="90%" stop-color="#115e59"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </radialGradient>
    <linearGradient id="sl-cream-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef3c7"/>
      <stop offset="75%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="sl-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#042f2e" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="64" cy="116" rx="46" ry="10" fill="#1e293b" opacity="0.4"/>

  <!-- Slumber Colossus Body -->
  <g id="body-assembly" filter="url(#sl-shadow)">
    <!-- Pointy Bear Ears -->
    <polygon points="34,36 24,14 46,26" fill="#0f766e" stroke="#134e4a" stroke-width="2"/>
    <polygon points="94,36 104,14 82,26" fill="#0f766e" stroke="#134e4a" stroke-width="2"/>

    <!-- Giant Rounded Belly Body -->
    <circle cx="64" cy="74" rx="48" ry="42" fill="url(#sl-fur-grad)" stroke="#134e4a" stroke-width="2.5"/>

    <!-- Padded Feet with Claws (Sprawled outward) -->
    <!-- Left Foot -->
    <ellipse cx="28" cy="106" rx="14" ry="10" fill="url(#sl-cream-grad)" stroke="#b45309" stroke-width="2"/>
    <circle cx="28" cy="106" r="6" fill="#d97706" opacity="0.4"/>
    <polygon points="18,102 14,98 20,96" fill="#ffffff"/>
    <polygon points="24,98 22,94 28,94" fill="#ffffff"/>
    <polygon points="32,98 32,94 36,96" fill="#ffffff"/>

    <!-- Right Foot -->
    <ellipse cx="100" cy="106" rx="14" ry="10" fill="url(#sl-cream-grad)" stroke="#b45309" stroke-width="2"/>
    <circle cx="100" cy="106" r="6" fill="#d97706" opacity="0.4"/>
    <polygon points="110,102 114,98 108,96" fill="#ffffff"/>
    <polygon points="104,98 106,94 100,94" fill="#ffffff"/>
    <polygon points="96,98 96,94 92,96" fill="#ffffff"/>

    <!-- Giant Cream Belly Oval -->
    <ellipse cx="64" cy="80" rx="34" ry="28" fill="url(#sl-cream-grad)" stroke="#d97706" stroke-width="2"/>

    <!-- Bear Head -->
    <circle cx="64" cy="44" r="28" fill="url(#sl-fur-grad)" stroke="#134e4a" stroke-width="2"/>

    <!-- Cream Face Mask -->
    <path d="M46 36 Q64 42 82 36 Q88 48 82 60 Q64 68 46 60 Q40 48 46 36 Z" fill="url(#sl-cream-grad)" stroke="#d97706" stroke-width="1.8"/>

    <!-- Peaceful Closed Eyes (Sleepy Arcs) -->
    <path d="M48 46 Q54 42 60 46" stroke="#134e4a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M68 46 Q74 42 80 46" stroke="#134e4a" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Tiny Button Nose -->
    <circle cx="64" cy="50" r="1.5" fill="#134e4a"/>

    <!-- Peaceful Sleep Smile & Upward Fangs -->
    <path d="M56 56 Q64 62 72 56" stroke="#134e4a" stroke-width="2" stroke-linecap="round" fill="none"/>
    <polygon points="57,56 59,52 61,56" fill="#ffffff"/>
    <polygon points="67,56 69,52 71,56" fill="#ffffff"/>

    <!-- Resting Paws across chest -->
    <ellipse cx="40" cy="74" rx="8" ry="6" fill="#0f766e" stroke="#134e4a" stroke-width="1.8"/>
    <ellipse cx="88" cy="74" rx="8" ry="6" fill="#0f766e" stroke="#134e4a" stroke-width="1.8"/>

    <!-- Floating Snoozing "Zzz" Sleep Wisps -->
    <text x="86" y="28" font-family="'VT323', monospace" font-size="16" font-weight="900" fill="#38bdf8">Z</text>
    <text x="98" y="20" font-family="'VT323', monospace" font-size="14" font-weight="900" fill="#7dd3fc">z</text>
    <text x="108" y="14" font-family="'VT323', monospace" font-size="12" font-weight="900" fill="#bae6fd">z</text>
  </g>
</svg>
