<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="doc-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="0" flood-color="#1e251a" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="paper-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="pdf-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="gold-seal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Document Sheet with Folded Corner (Dog-ear) -->
  <path d="M12 16 C12 11.58 15.58 8 20 8 H38 L52 22 V50 C52 54.42 48.42 58 44 58 H20 C15.58 58 12 54.42 12 50 Z" fill="url(#paper-grad)" stroke="#1e251a" stroke-width="2.5" filter="url(#doc-shadow)" stroke-linejoin="round"/>

  <!-- Folded Corner Flap -->
  <path d="M38 8 V20 C38 21.1 38.9 22 40 22 H52 Z" fill="#e2e8f0" stroke="#1e251a" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Red "PDF" Badge Tag -->
  <rect x="8" y="18" width="22" height="11" rx="3.5" fill="url(#pdf-red)" stroke="#1e251a" stroke-width="1.8"/>
  <text x="19" y="26.5" font-family="monospace, sans-serif" font-size="7.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">PDF</text>

  <!-- Structured Resume Content Lines -->
  <line x1="20" y1="35" x2="44" y2="35" stroke="#1e251a" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="20" y1="41" x2="38" y2="41" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="47" x2="32" y2="47" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>

  <!-- Gold Quality Ribbon / Verified Seal -->
  <path d="M42 48 L39 56 L42 53 L45 56 Z" fill="#d97706" stroke="#1e251a" stroke-width="1.2"/>
  <circle cx="42" cy="46" r="5.5" fill="url(#gold-seal)" stroke="#1e251a" stroke-width="1.8"/>
  <path d="M40 46 L41.5 47.5 L44.5 44.5" stroke="#1e251a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
