<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="game-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="0" flood-color="#1e251a" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <!-- Handheld Retro Console Body -->
  <rect x="12" y="6" width="40" height="52" rx="10" fill="url(#body-grad)" stroke="#1e251a" stroke-width="2.5" filter="url(#game-shadow)"/>

  <!-- Screen Frame -->
  <rect x="18" y="12" width="28" height="20" rx="4" fill="#1e293b" stroke="#1e251a" stroke-width="1.8"/>
  <!-- Dot Matrix Screen -->
  <rect x="21" y="15" width="22" height="14" rx="2" fill="url(#screen-grad)"/>
  
  <!-- Mini Screen Character Pixel Dot -->
  <rect x="30" y="20" width="4" height="4" rx="1" fill="#14532d"/>

  <!-- D-Pad -->
  <path d="M26 40 H23 V43 H26 V46 H29 V43 H32 V40 H29 V37 H26 Z" fill="#1e293b" stroke="#1e251a" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Action Buttons (A & B) -->
  <circle cx="41" cy="43.5" r="3" fill="#ef4444" stroke="#1e251a" stroke-width="1.2"/>
  <circle cx="45" cy="38" r="3" fill="#f59e0b" stroke="#1e251a" stroke-width="1.2"/>

  <!-- Select / Start Slanted Pills -->
  <line x1="28" y1="51" x2="31" y2="51" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="33" y1="51" x2="36" y2="51" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
</svg>
