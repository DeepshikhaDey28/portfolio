<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="capsule-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="0" flood-color="#1e251a"/>
    </filter>
    <radialGradient id="cap-top" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="70%" stop-color="#ee3838"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </radialGradient>
    <radialGradient id="cap-bot" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
  </defs>

  <!-- Outer Pip-Capsule Sphere with Pixel Bevel Outline -->
  <circle cx="32" cy="32" r="27" fill="url(#cap-bot)" stroke="#1e293b" stroke-width="3" filter="url(#capsule-shadow)"/>

  <!-- Top Red Dome -->
  <path d="M5.5 32 A26.5 26.5 0 0 1 58.5 32 Z" fill="url(#cap-top)"/>

  <!-- Specular Arc Highlight on Top Dome -->
  <path d="M12 25 A22 22 0 0 1 42 10" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Center Dividing Seam / Trench -->
  <rect x="5.5" y="29" width="53" height="6" fill="#0f172a"/>

  <!-- Center Catch Latch Button Outer Rim -->
  <circle cx="32" cy="32" r="9" fill="#0f172a"/>
  <!-- Center Catch Button Core -->
  <circle cx="32" cy="32" r="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="2.5" fill="#facc15"/>

  <!-- Golden Game Sparkles / Catch Stars -->
  <polygon points="50,6 52,10 56,12 52,14 50,18 48,14 44,12 48,10" fill="#facc15"/>
  <polygon points="10,48 11,51 14,52 11,53 10,56 9,53 6,52 9,51" fill="#38bdf8"/>
</svg>
