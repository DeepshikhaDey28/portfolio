<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="vs-sphere-grad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="95%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>
    <radialGradient id="vs-eye-core" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f87171"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <linearGradient id="vs-mag-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="vs-mag-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="70%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="vs-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="64" cy="116" rx="34" ry="7" fill="#1e293b" opacity="0.35"/>

  <!-- Left Horseshoe Magnet -->
  <g id="left-magnet">
    <!-- Horseshoe Gray Base -->
    <path d="M40 50 L14 42 L12 86 L38 78 L34 70 L22 74 L24 54 L36 58 Z" fill="#64748b" stroke="#1e293b" stroke-width="2"/>
    <!-- North / Red Pole -->
    <polygon points="14,42 8,40 10,56 16,58" fill="url(#vs-mag-red)" stroke="#991b1b" stroke-width="1.5"/>
    <text x="11" y="52" font-family="monospace" font-size="8" font-weight="900" fill="#ffffff">N</text>
    <!-- South / Blue Pole -->
    <polygon points="12,72 6,74 8,90 14,88" fill="url(#vs-mag-blue)" stroke="#1e40af" stroke-width="1.5"/>
    <text x="9" y="84" font-family="monospace" font-size="8" font-weight="900" fill="#ffffff">S</text>
  </g>

  <!-- Right Horseshoe Magnet -->
  <g id="right-magnet">
    <!-- Horseshoe Gray Base -->
    <path d="M88 50 L114 42 L116 86 L90 78 L94 70 L106 74 L104 54 L92 58 Z" fill="#64748b" stroke="#1e293b" stroke-width="2"/>
    <!-- North / Red Pole -->
    <polygon points="114,42 120,40 118,56 112,58" fill="url(#vs-mag-red)" stroke="#991b1b" stroke-width="1.5"/>
    <text x="114" y="52" font-family="monospace" font-size="8" font-weight="900" fill="#ffffff">N</text>
    <!-- South / Blue Pole -->
    <polygon points="116,72 122,74 120,90 114,88" fill="url(#vs-mag-blue)" stroke="#1e40af" stroke-width="1.5"/>
    <text x="115" y="84" font-family="monospace" font-size="8" font-weight="900" fill="#ffffff">S</text>
  </g>

  <!-- Central Chrome Unit -->
  <g id="central-unit" filter="url(#vs-shadow)">
    <!-- Top Machine Screw -->
    <rect x="60" y="14" width="8" height="12" fill="#94a3b8" stroke="#334155" stroke-width="1.8"/>
    <polygon points="56,14 72,14 68,8 60,8" fill="#cbd5e1" stroke="#334155" stroke-width="1.8"/>
    <line x1="58" y1="11" x2="70" y2="11" stroke="#334155" stroke-width="1.5"/>

    <!-- Bottom Left & Right Screws -->
    <polygon points="44,92 48,104 42,106 38,94" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>
    <polygon points="84,92 80,104 86,106 90,94" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>

    <!-- Main Spherical Steel Body -->
    <circle cx="64" cy="64" r="32" fill="url(#vs-sphere-grad)" stroke="#1e293b" stroke-width="2.5"/>

    <!-- Central Camera / Eye Aperture Ring -->
    <circle cx="64" cy="64" r="16" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <circle cx="64" cy="64" r="12" fill="url(#vs-eye-core)"/>
    <circle cx="64" cy="64" r="6" fill="#0f172a"/>
    <!-- Specular Lens Highlights -->
    <circle cx="61" cy="60" r="3.5" fill="#ffffff"/>
    <circle cx="67" cy="67" r="1.5" fill="#fca5a5"/>

    <!-- Crackling Electric Arc bridging magnets to sphere -->
    <path d="M24 64 Q38 56 46 62 Q54 68 64 64" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M104 64 Q90 56 82 62 Q74 68 64 64" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <!-- Blue lightning sparks -->
    <polygon points="34,58 38,54 36,60 40,58" fill="#fde047"/>
    <polygon points="94,58 90,54 92,60 88,58" fill="#fde047"/>
  </g>
</svg>
