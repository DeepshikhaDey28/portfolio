<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="proj-term-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="0" flood-color="#1e251a" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="term-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyan-code" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Developer Code Terminal Window Body -->
  <rect x="8" y="8" width="48" height="48" rx="10" fill="url(#term-body)" stroke="#1e251a" stroke-width="2.5" filter="url(#proj-term-shadow)"/>

  <!-- Top Titlebar Strip -->
  <path d="M8 18 H56 V18 C56 12.477 51.523 8 46 8 H18 C12.477 8 8 12.477 8 18 Z" fill="#334155"/>
  <line x1="8" y1="18" x2="56" y2="18" stroke="#1e251a" stroke-width="2"/>

  <!-- Window Traffic Lights (Red, Amber, Green) -->
  <circle cx="15" cy="13" r="2.5" fill="#ef4444" stroke="#1e251a" stroke-width="1"/>
  <circle cx="22" cy="13" r="2.5" fill="#f59e0b" stroke="#1e251a" stroke-width="1"/>
  <circle cx="29" cy="13" r="2.5" fill="#10b981" stroke="#1e251a" stroke-width="1"/>

  <!-- Inner Code Screen -->
  <rect x="12" y="22" width="40" height="30" rx="4" fill="url(#screen-glow)"/>

  <!-- Code Bracket Tag: </ > -->
  <path d="M21 29 L16 35 L21 41" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M31 28 L27 42" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
  <path d="M37 29 L42 35 L37 41" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Git Branch Nodes at Bottom -->
  <circle cx="20" cy="46" r="2" fill="#34d399"/>
  <line x1="20" y1="46" x2="32" y2="46" stroke="#34d399" stroke-width="1.8"/>
  <circle cx="32" cy="46" r="2" fill="#f43f5e"/>
  <line x1="32" y1="46" x2="44" y2="46" stroke="#34d399" stroke-width="1.8"/>
  <circle cx="44" cy="46" r="2" fill="#34d399"/>
</svg>
