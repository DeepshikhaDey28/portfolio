<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="proj-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="0" flood-color="#1e251a" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="folder-tab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="folder-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
  </defs>

  <!-- Folder Back Tab -->
  <path d="M8 18 C8 14.686 10.686 12 14 12 H26 L32 18 H50 C53.314 18 56 20.686 56 24 V48 C56 51.314 53.314 54 50 54 H14 C10.686 54 8 51.314 8 48 Z" fill="url(#folder-tab)" stroke="#1e251a" stroke-width="2.5" filter="url(#proj-shadow)"/>
  
  <!-- Folder Front Pocket -->
  <path d="M8 26 C8 23 10.5 21 13.5 21 H50.5 C53.5 21 56 23 56 26 V48 C56 51.314 53.314 54 50 54 H14 C10.686 54 8 51.314 8 48 Z" fill="url(#folder-body)" stroke="#1e251a" stroke-width="2.5"/>

  <!-- Developer Code Bracket glyph inside folder: { } -->
  <path d="M25 32 C23 32 21 34 21 36 V37 C21 39 19 40 17 40 C19 40 21 41 21 43 V44 C21 46 23 48 25 48" stroke="#1e251a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M39 32 C41 32 43 34 43 36 V37 C43 39 45 40 47 40 C45 40 43 41 43 43 V44 C43 46 41 48 39 48" stroke="#1e251a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Code Slash / Git Branch Accent -->
  <circle cx="32" cy="36" r="2.5" fill="#1e251a"/>
  <circle cx="32" cy="44" r="2.5" fill="#1e251a"/>
  <line x1="32" y1="36" x2="32" y2="44" stroke="#1e251a" stroke-width="2"/>
</svg>
