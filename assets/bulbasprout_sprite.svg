<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bs-skin-grad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="85%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="bs-bulb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="85%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </linearGradient>
    <linearGradient id="bs-flower-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="45%" stop-color="#ec4899"/>
      <stop offset="85%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <radialGradient id="bs-dew" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
    <filter id="bs-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#052e16" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="64" cy="116" rx="40" ry="8" fill="#1e293b" opacity="0.35"/>

  <!-- Blooming Bulb / Bud on Back (Behind Head) -->
  <g id="bulb-assembly" filter="url(#bs-shadow)">
    <!-- Back Bulb Bulbous Layers -->
    <path d="M50 48 Q32 28 50 14 Q68 4 82 22 Q94 36 78 52 Z" fill="url(#bs-bulb-grad)" stroke="#14532d" stroke-width="2"/>
    <!-- Leaf Segments & Veins -->
    <path d="M54 44 Q42 26 54 18 Q66 12 76 24" fill="none" stroke="#86efac" stroke-width="1.8"/>
    <!-- Blooming Flower Petals Emerging at Apex -->
    <path d="M62 20 Q56 8 68 6 Q76 12 72 22 Z" fill="url(#bs-flower-grad)" stroke="#831843" stroke-width="1.5"/>
    <path d="M70 22 Q78 10 86 12 Q88 20 78 24 Z" fill="url(#bs-flower-grad)" stroke="#831843" stroke-width="1.5"/>
    <path d="M54 22 Q46 14 56 10 Q64 16 60 24 Z" fill="url(#bs-flower-grad)" stroke="#831843" stroke-width="1.5"/>
    <circle cx="68" cy="14" r="2.5" fill="#fde047"/>

    <!-- Curling Graceful Vine Tendril -->
    <path d="M82 32 Q104 20 102 36 Q100 48 88 42" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
    <path d="M102 36 Q108 34 106 40" fill="none" stroke="#22c55e" stroke-width="2"/>

    <!-- Dew Drop on Leaf -->
    <circle cx="48" cy="30" r="3" fill="url(#bs-dew)" opacity="0.85"/>
    <circle cx="47" cy="29" r="1" fill="#ffffff"/>
  </g>

  <!-- Saurian Quadruped Body -->
  <g id="body-assembly">
    <!-- Back Left Leg -->
    <rect x="30" y="86" width="16" height="24" rx="8" fill="#15803d" stroke="#14532d" stroke-width="1.8"/>
    <path d="M32 110 Q34 105 37 110 M37 110 Q40 105 43 110" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Back Right Leg -->
    <rect x="80" y="86" width="16" height="24" rx="8" fill="#15803d" stroke="#14532d" stroke-width="1.8"/>
    <path d="M82 110 Q85 105 88 110 M88 110 Q91 105 94 110" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Main Torso -->
    <ellipse cx="64" cy="84" rx="34" ry="24" fill="url(#bs-skin-grad)" stroke="#14532d" stroke-width="2"/>

    <!-- Front Left Foot -->
    <rect x="42" y="92" width="16" height="24" rx="8" fill="url(#bs-skin-grad)" stroke="#14532d" stroke-width="1.8"/>
    <!-- Claws -->
    <path d="M44 116 Q46 110 49 116 M49 116 Q52 110 55 116" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none"/>

    <!-- Front Right Foot -->
    <rect x="68" y="92" width="16" height="24" rx="8" fill="url(#bs-skin-grad)" stroke="#14532d" stroke-width="1.8"/>
    <path d="M70 116 Q73 110 76 116 M76 116 Q79 110 82 116" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none"/>

    <!-- Dark Green Polygonal Skin Spots -->
    <polygon points="52,74 58,72 60,78 54,80" fill="#15803d"/>
    <polygon points="72,76 78,74 80,82 74,84" fill="#15803d"/>
    <polygon points="44,86 48,84 50,90 46,92" fill="#15803d"/>

    <!-- Wide Cute Head -->
    <path d="M38 52 Q32 30 52 28 Q76 28 88 36 Q98 48 90 68 Q80 78 58 76 Q42 74 38 52 Z" fill="url(#bs-skin-grad)" stroke="#14532d" stroke-width="2"/>

    <!-- Pointy Saurian Ears -->
    <polygon points="42,32 34,22 48,28" fill="#22c55e" stroke="#14532d" stroke-width="1.5"/>
    <polygon points="40,30 36,24 44,28" fill="#15803d"/>
    <polygon points="78,30 88,20 84,32" fill="#22c55e" stroke="#14532d" stroke-width="1.5"/>
    <polygon points="80,30 86,22 82,30" fill="#15803d"/>

    <!-- Head Dark Green Spots -->
    <polygon points="56,36 62,34 64,40 58,42" fill="#15803d"/>

    <!-- Expressive Ruby Eyes -->
    <!-- Left Eye -->
    <ellipse cx="48" cy="48" rx="5" ry="7" fill="#dc2626" stroke="#7f1d1d" stroke-width="1"/>
    <ellipse cx="48" cy="49" rx="3.5" ry="5" fill="#991b1b"/>
    <circle cx="46" cy="46" r="2" fill="#ffffff"/>

    <!-- Right Eye -->
    <ellipse cx="74" cy="50" rx="6" ry="8" fill="#dc2626" stroke="#7f1d1d" stroke-width="1"/>
    <ellipse cx="74" cy="51" rx="4.5" ry="6" fill="#991b1b"/>
    <circle cx="72" cy="47" r="2.5" fill="#ffffff"/>
    <circle cx="76" cy="53" r="1.2" fill="#ffffff"/>

    <!-- Cute Smiling Snout & Fangs -->
    <path d="M54 62 Q66 68 76 60" stroke="#14532d" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Tiny White Fangs -->
    <polygon points="57,63 59,67 61,63" fill="#ffffff"/>
    <polygon points="69,63 71,67 73,63" fill="#ffffff"/>
  </g>
</svg>
