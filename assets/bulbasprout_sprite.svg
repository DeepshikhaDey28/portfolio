<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="sprout-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#22c55e"/>
    </filter>
    <linearGradient id="sprout-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="sprout-bulb" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
  </defs>

  <!-- Big Data Bulb on Back (Bulbasaur style) -->
  <path d="M92 48 C105 25 140 35 135 68 C130 92 105 95 90 75 Z" fill="url(#sprout-bulb)" stroke="#14532d" stroke-width="2.5" filter="url(#sprout-glow)"/>
  <!-- Leaf veins on bulb -->
  <path d="M110 40 Q118 55 125 65" stroke="#bbf7d0" stroke-width="2" fill="none"/>
  <path d="M120 48 Q115 60 110 70" stroke="#bbf7d0" stroke-width="1.5" fill="none"/>

  <!-- Back Foot -->
  <ellipse cx="118" cy="128" rx="13" ry="8" fill="#15803d"/>
  <circle cx="112" cy="129" r="2" fill="#fff"/>
  <circle cx="118" cy="131" r="2" fill="#fff"/>
  <circle cx="124" cy="129" r="2" fill="#fff"/>

  <!-- Body Quadruped -->
  <ellipse cx="85" cy="100" rx="42" ry="28" fill="url(#sprout-body)" stroke="#14532d" stroke-width="2.5"/>

  <!-- Dark Teal Patches -->
  <ellipse cx="78" cy="95" rx="8" ry="6" fill="#166534" opacity="0.6"/>
  <ellipse cx="102" cy="102" rx="6" ry="5" fill="#166534" opacity="0.6"/>

  <!-- Front Foot Left -->
  <ellipse cx="58" cy="128" rx="12" ry="8" fill="#15803d"/>
  <circle cx="53" cy="129" r="2" fill="#fff"/>
  <circle cx="58" cy="131" r="2" fill="#fff"/>
  <circle cx="63" cy="129" r="2" fill="#fff"/>

  <!-- Front Foot Right -->
  <ellipse cx="88" cy="130" rx="12" ry="8" fill="#15803d"/>
  <circle cx="83" cy="131" r="2" fill="#fff"/>
  <circle cx="88" cy="133" r="2" fill="#fff"/>
  <circle cx="93" cy="131" r="2" fill="#fff"/>

  <!-- Head -->
  <ellipse cx="50" cy="72" rx="28" ry="25" fill="url(#sprout-body)" stroke="#14532d" stroke-width="2.5"/>

  <!-- Cute Leaf Ears -->
  <polygon points="34,54 28,36 44,48" fill="#22c55e" stroke="#14532d" stroke-width="1.5"/>
  <polygon points="58,52 70,36 66,50" fill="#22c55e" stroke="#14532d" stroke-width="1.5"/>

  <!-- Big Crimson / Ruby Eyes -->
  <ellipse cx="40" cy="68" rx="6" ry="8.5" fill="#be123c"/>
  <ellipse cx="58" cy="68" rx="6" ry="8.5" fill="#be123c"/>
  <circle cx="38" cy="65" r="2.5" fill="#ffffff"/>
  <circle cx="56" cy="65" r="2.5" fill="#ffffff"/>

  <!-- Tiny Cute Smile -->
  <path d="M44 80 Q49 85 54 80" stroke="#14532d" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Little Sprout on Head -->
  <path d="M48 50 Q45 38 40 38 Q48 42 48 50 Z" fill="#86efac"/>
</svg>
