<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bulb-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#86efac" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bulb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="patch-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <filter id="shadow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#042f2e" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="172" rx="65" ry="16" fill="rgba(6, 78, 59, 0.45)"/>

  <!-- Glowing Aura behind Bulb -->
  <circle cx="125" cy="85" r="45" fill="url(#bulb-glow)"/>

  <!-- Back Left Leg -->
  <path d="M130 130 C130 115 148 118 152 135 C155 148 150 162 142 165 C132 168 126 155 130 130 Z" fill="#0f766e" stroke="#042f2e" stroke-width="2.5"/>
  <circle cx="138" cy="164" r="3" fill="#ffffff"/>
  <circle cx="144" cy="163" r="3" fill="#ffffff"/>

  <!-- Large Layered Plant Bulb on Back -->
  <!-- Bulb Back Petals -->
  <path d="M105 105 C95 65 125 38 145 50 C165 62 160 100 135 115 Z" fill="#15803d" stroke="#052e16" stroke-width="2.5"/>
  <!-- Bulb Main Body -->
  <path d="M100 95 C90 60 115 40 130 45 C150 50 165 75 145 110 C130 125 105 120 100 95 Z" fill="url(#bulb-grad)" stroke="#052e16" stroke-width="2.5"/>
  <!-- Bulb Front Leaf Petal -->
  <path d="M110 90 C105 70 120 55 135 60 C145 75 135 100 120 105 Z" fill="#86efac" stroke="#052e16" stroke-width="1.8"/>
  <path d="M120 62 Q125 80 128 95" stroke="#16a34a" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Main Quadruped Body -->
  <path d="M60 110 C50 95 85 85 125 95 C145 100 152 120 145 142 C138 160 110 165 80 158 C62 152 55 135 60 110 Z" fill="url(#body-grad)" stroke="#042f2e" stroke-width="3" filter="url(#shadow-filter)"/>

  <!-- Dark Teal Dinosaur Patches -->
  <path d="M92 110 L104 106 L108 116 L98 122 Z" fill="url(#patch-grad)"/>
  <path d="M120 122 L132 118 L134 128 L124 132 Z" fill="url(#patch-grad)"/>
  <path d="M80 132 L90 128 L92 138 L82 140 Z" fill="url(#patch-grad)"/>

  <!-- Back Right Leg (Front-facing back) -->
  <path d="M98 135 C98 125 112 125 118 138 C122 148 120 166 112 168 C104 170 96 158 98 135 Z" fill="url(#body-grad)" stroke="#042f2e" stroke-width="2.5"/>
  <circle cx="102" cy="167" r="3" fill="#ffffff"/>
  <circle cx="108" cy="168" r="3" fill="#ffffff"/>
  <circle cx="114" cy="167" r="3" fill="#ffffff"/>

  <!-- Front Left Leg -->
  <path d="M52 125 C50 110 65 110 70 125 C74 138 72 162 65 165 C58 168 50 155 52 125 Z" fill="#0f766e" stroke="#042f2e" stroke-width="2.5"/>
  <circle cx="56" cy="164" r="3" fill="#ffffff"/>
  <circle cx="62" cy="165" r="3" fill="#ffffff"/>

  <!-- Front Right Leg -->
  <path d="M68 130 C68 115 85 118 88 132 C92 145 90 166 82 169 C74 172 66 158 68 130 Z" fill="url(#body-grad)" stroke="#042f2e" stroke-width="2.5"/>
  <circle cx="72" cy="168" r="3" fill="#ffffff"/>
  <circle cx="78" cy="169" r="3" fill="#ffffff"/>
  <circle cx="84" cy="168" r="3" fill="#ffffff"/>

  <!-- Head & Ears -->
  <!-- Left Ear -->
  <path d="M38 68 L28 42 L48 55 Z" fill="url(#body-grad)" stroke="#042f2e" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="32,48 30,44 40,52" fill="#0d9488"/>

  <!-- Right Ear -->
  <path d="M68 62 L82 38 L80 58 Z" fill="url(#body-grad)" stroke="#042f2e" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="76,46 80,40 76,54" fill="#0d9488"/>

  <!-- Head Oval -->
  <path d="M35 85 C28 65 52 50 75 56 C95 62 100 85 92 105 C85 122 55 125 40 110 C32 102 32 92 35 85 Z" fill="url(#body-grad)" stroke="#042f2e" stroke-width="3"/>

  <!-- Forehead Patch -->
  <polygon points="56,62 66,58 68,66 58,68" fill="url(#patch-grad)"/>

  <!-- Cute Snout & Nostrils -->
  <circle cx="48" cy="98" r="1.5" fill="#042f2e"/>
  <circle cx="56" cy="98" r="1.5" fill="#042f2e"/>

  <!-- Big Expressive Pokémon Eyes -->
  <!-- Left Eye -->
  <ellipse cx="46" cy="80" rx="7.5" ry="11" fill="#e11d48" stroke="#042f2e" stroke-width="2" transform="rotate(-6 46 80)"/>
  <ellipse cx="45" cy="80" rx="5" ry="8" fill="#be123c"/>
  <circle cx="43" cy="76" r="3.2" fill="#ffffff"/>
  <circle cx="47" cy="84" r="1.5" fill="#ffffff"/>

  <!-- Right Eye -->
  <ellipse cx="70" cy="78" rx="8" ry="11.5" fill="#e11d48" stroke="#042f2e" stroke-width="2" transform="rotate(8 70 78)"/>
  <ellipse cx="71" cy="78" rx="5.5" ry="8.5" fill="#be123c"/>
  <circle cx="68" cy="74" r="3.5" fill="#ffffff"/>
  <circle cx="73" cy="83" r="1.6" fill="#ffffff"/>

  <!-- Cheerful Smile with Tiny White Fangs -->
  <path d="M48 104 Q60 115 72 102" stroke="#042f2e" stroke-width="2.5" fill="#be123c" stroke-linecap="round"/>
  <polygon points="52,104 55,108 57,104" fill="#ffffff"/>
  <polygon points="65,103 67,107 69,103" fill="#ffffff"/>
</svg>
