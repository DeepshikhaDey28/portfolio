<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" width="220" height="60">
  <defs>
    <!-- Sandy Dirt Rim Gradient -->
    <linearGradient id="sandRimGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfbc8e"/>
      <stop offset="60%" stop-color="#ad9867"/>
      <stop offset="100%" stop-color="#7a683e"/>
    </linearGradient>
    <!-- Sandy Surface Gradient -->
    <radialGradient id="sandSurfGrad" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#faedd1"/>
      <stop offset="45%" stop-color="#eddab4"/>
      <stop offset="85%" stop-color="#dac497"/>
      <stop offset="100%" stop-color="#c4ac79"/>
    </radialGradient>
  </defs>

  <!-- Ground Under-Shadow -->
  <ellipse cx="110" cy="38" rx="100" ry="16" fill="#000000" fill-opacity="0.25"/>

  <!-- Earth 3D Base Rim -->
  <ellipse cx="110" cy="32" rx="104" ry="22" fill="url(#sandRimGrad)" stroke="#5c4d28" stroke-width="2"/>

  <!-- Sand Disc Surface -->
  <ellipse cx="110" cy="26" rx="102" ry="21" fill="url(#sandSurfGrad)" stroke="#786638" stroke-width="1.8"/>

  <!-- Subtle Sandy/Pebble Texture Dots around perimeter -->
  <ellipse cx="40" cy="24" rx="4" ry="2.5" fill="#cfb989" opacity="0.6"/>
  <ellipse cx="70" cy="18" rx="5" ry="2.5" fill="#cfb989" opacity="0.5"/>
  <ellipse cx="100" cy="15" rx="6" ry="2.5" fill="#cfb989" opacity="0.5"/>
  <ellipse cx="140" cy="16" rx="5" ry="2.5" fill="#cfb989" opacity="0.5"/>
  <ellipse cx="175" cy="22" rx="4" ry="2" fill="#cfb989" opacity="0.6"/>
  <ellipse cx="160" cy="35" rx="5" ry="2.5" fill="#cfb989" opacity="0.6"/>
  <ellipse cx="120" cy="38" rx="6" ry="3" fill="#cfb989" opacity="0.6"/>
  <ellipse cx="60" cy="35" rx="5" ry="2.5" fill="#cfb989" opacity="0.6"/>

  <!-- Center highlight glow -->
  <ellipse cx="110" cy="25" rx="70" ry="12" fill="#fff5e0" fill-opacity="0.4"/>
</svg>
