<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 54" width="210" height="54">
  <defs>
    <!-- Earth base gradient -->
    <linearGradient id="dirtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a4843b"/>
      <stop offset="60%" stop-color="#7e6323"/>
      <stop offset="100%" stop-color="#523f12"/>
    </linearGradient>
    <!-- Grass surface gradient -->
    <radialGradient id="grassSurfGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8af062"/>
      <stop offset="50%" stop-color="#56c83b"/>
      <stop offset="85%" stop-color="#3c9e25"/>
      <stop offset="100%" stop-color="#287317"/>
    </radialGradient>
  </defs>

  <!-- Dirt under-layer / 3D rim -->
  <ellipse cx="105" cy="30" rx="98" ry="20" fill="url(#dirtGrad)" stroke="#3f300c" stroke-width="2.5"/>
  <!-- Under shadow -->
  <ellipse cx="105" cy="34" rx="92" ry="13" fill="#000000" fill-opacity="0.25"/>

  <!-- Main Grass Disc -->
  <ellipse cx="105" cy="23" rx="96" ry="19" fill="url(#grassSurfGrad)" stroke="#225c15" stroke-width="2"/>

  <!-- Jagged Grass Tuft Rim -->
  <path d="M 12,23
    L 16,18 L 20,23 L 24,17 L 28,22 L 34,16 L 40,21 L 48,15 L 56,21
    L 66,14 L 76,20 L 88,13 L 100,20 L 112,13 L 124,20 L 136,14
    L 146,21 L 156,15 L 164,21 L 172,16 L 178,22 L 184,17 L 190,23
    L 194,19 L 198,23
    Q 202,32 105,42
    Q 8,32 12,23 Z"
    fill="url(#grassSurfGrad)" stroke="#225c15" stroke-width="1.8"/>

  <!-- Inner highlights / texture -->
  <ellipse cx="105" cy="22" rx="72" ry="11" fill="#8bf262" fill-opacity="0.45"/>
  <ellipse cx="105" cy="22" rx="46" ry="6" fill="#b9f99e" fill-opacity="0.5"/>
</svg>
