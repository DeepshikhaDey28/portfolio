<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" width="280" height="72">
  <defs>
    <!-- Sandy Dirt Rim Gradient -->
    <linearGradient id="sandPlayerRimGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfbc8e"/>
      <stop offset="60%" stop-color="#ad9867"/>
      <stop offset="100%" stop-color="#69562e"/>
    </linearGradient>
    <!-- Sandy Surface Gradient -->
    <radialGradient id="sandPlayerSurfGrad" cx="50%" cy="36%" r="52%">
      <stop offset="0%" stop-color="#faedd1"/>
      <stop offset="45%" stop-color="#eddab4"/>
      <stop offset="85%" stop-color="#dac497"/>
      <stop offset="100%" stop-color="#beaa76"/>
    </radialGradient>
  </defs>

  <!-- Ground Drop Shadow -->
  <ellipse cx="140" cy="46" rx="132" ry="20" fill="#000000" fill-opacity="0.3"/>

  <!-- Earth 3D Base Rim -->
  <ellipse cx="140" cy="38" rx="136" ry="26" fill="url(#sandPlayerRimGrad)" stroke="#52431f" stroke-width="2.5"/>

  <!-- Sand Disc Surface -->
  <ellipse cx="140" cy="30" rx="134" ry="25" fill="url(#sandPlayerSurfGrad)" stroke="#6e5d32" stroke-width="2"/>

  <!-- Pebble Texture Spots around circumference -->
  <ellipse cx="40" cy="28" rx="6" ry="3" fill="#cfb989" opacity="0.6"/>
  <ellipse cx="80" cy="18" rx="7" ry="3" fill="#cfb989" opacity="0.5"/>
  <ellipse cx="130" cy="15" rx="8" ry="3.5" fill="#cfb989" opacity="0.5"/>
  <ellipse cx="190" cy="17" rx="7" ry="3" fill="#cfb989" opacity="0.5"/>
  <ellipse cx="240" cy="26" rx="6" ry="3" fill="#cfb989" opacity="0.6"/>
  <ellipse cx="210" cy="44" rx="7" ry="3.5" fill="#cfb989" opacity="0.6"/>
  <ellipse cx="150" cy="48" rx="8" ry="4" fill="#cfb989" opacity="0.6"/>
  <ellipse cx="80" cy="44" rx="7" ry="3.5" fill="#cfb989" opacity="0.6"/>

  <!-- Center highlight glow -->
  <ellipse cx="140" cy="28" rx="95" ry="14" fill="#fff5e0" fill-opacity="0.45"/>
</svg>
