<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="gp-body-grad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="35%" stop-color="#9333ea"/>
      <stop offset="70%" stop-color="#6b21a8"/>
      <stop offset="95%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#1e0538"/>
    </radialGradient>
    <radialGradient id="gp-eye-grad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f87171"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <filter id="gp-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2e1065" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Ghostly Dark Leyline Portal / Shadow -->
  <ellipse cx="64" cy="116" rx="42" ry="9" fill="#2e1065" opacity="0.65"/>
  <ellipse cx="64" cy="116" rx="28" ry="5" fill="#3b0764" opacity="0.85"/>

  <!-- Spiky Back & Head Horns -->
  <g id="spikes-assembly">
    <!-- Top Center Spike -->
    <polygon points="56,34 64,8 72,34" fill="#581c87" stroke="#2e1065" stroke-width="2"/>
    <!-- Left Crown Spikes -->
    <polygon points="38,44 18,18 48,34" fill="#6b21a8" stroke="#2e1065" stroke-width="2"/>
    <polygon points="26,56 6,36 34,50" fill="#581c87" stroke="#2e1065" stroke-width="2"/>
    <!-- Right Crown Spikes -->
    <polygon points="90,44 110,18 80,34" fill="#6b21a8" stroke="#2e1065" stroke-width="2"/>
    <polygon points="102,56 122,36 94,50" fill="#581c87" stroke="#2e1065" stroke-width="2"/>
  </g>

  <!-- Chubby Phantom Silhouette -->
  <g id="body-assembly" filter="url(#gp-shadow)">
    <!-- Main Ghost Body -->
    <ellipse cx="64" cy="74" rx="44" ry="38" fill="url(#gp-body-grad)" stroke="#2e1065" stroke-width="2.5"/>

    <!-- Ghost Feet / Chubby Stubs -->
    <ellipse cx="44" cy="110" rx="10" ry="7" fill="#4c1d95" stroke="#2e1065" stroke-width="2"/>
    <ellipse cx="84" cy="110" rx="10" ry="7" fill="#4c1d95" stroke="#2e1065" stroke-width="2"/>

    <!-- Sinister Glowing Ruby Eyes -->
    <!-- Left Eye -->
    <path d="M34 52 Q50 48 50 60 Q34 64 34 52 Z" fill="url(#gp-eye-grad)" stroke="#7f1d1d" stroke-width="1.5"/>
    <circle cx="45" cy="55" r="2.5" fill="#ffffff"/>

    <!-- Right Eye -->
    <path d="M94 52 Q78 48 78 60 Q94 64 94 52 Z" fill="url(#gp-eye-grad)" stroke="#7f1d1d" stroke-width="1.5"/>
    <circle cx="83" cy="55" r="2.5" fill="#ffffff"/>

    <!-- Iconic Wide Wicked Grinning Teeth Mouth -->
    <path d="M34 72 Q64 100 94 72 Q64 82 34 72 Z" fill="#ffffff" stroke="#2e1065" stroke-width="2.2"/>
    <!-- Individual Sharp Grid Teeth Lines -->
    <line x1="44" y1="74" x2="44" y2="84" stroke="#2e1065" stroke-width="2"/>
    <line x1="54" y1="77" x2="54" y2="90" stroke="#2e1065" stroke-width="2"/>
    <line x1="64" y1="78" x2="64" y2="92" stroke="#2e1065" stroke-width="2"/>
    <line x1="74" y1="77" x2="74" y2="90" stroke="#2e1065" stroke-width="2"/>
    <line x1="84" y1="74" x2="84" y2="84" stroke="#2e1065" stroke-width="2"/>

    <!-- Claw Hands Emerging Forward -->
    <path d="M16 80 Q10 88 18 94 Q26 92 24 82 Z" fill="#7e22ce" stroke="#2e1065" stroke-width="1.8"/>
    <polygon points="12,86 8,90 14,92" fill="#ffffff"/>
    <polygon points="16,92 14,96 20,95" fill="#ffffff"/>

    <path d="M112 80 Q118 88 110 94 Q102 92 104 82 Z" fill="#7e22ce" stroke="#2e1065" stroke-width="1.8"/>
    <polygon points="116,86 120,90 114,92" fill="#ffffff"/>
    <polygon points="112,92 114,96 108,95" fill="#ffffff"/>

    <!-- Phantom Ectoplasm Wisps -->
    <path d="M22 68 Q14 60 18 54 Q24 60 22 68 Z" fill="#a855f7" opacity="0.6"/>
    <path d="M106 68 Q114 60 110 54 Q104 60 106 68 Z" fill="#a855f7" opacity="0.6"/>
  </g>
</svg>
