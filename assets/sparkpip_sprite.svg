<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="sp-yellow-grad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="80%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="sp-tail-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="25%" stop-color="#a16207"/>
      <stop offset="30%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <radialGradient id="sp-sparkle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0"/>
    </radialGradient>
    <filter id="sp-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#713f12" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient Ground Shadow -->
  <ellipse cx="64" cy="116" rx="36" ry="8" fill="#1e293b" opacity="0.35"/>

  <!-- Jagged Lightning Bolt Tail (Behind Body) -->
  <g id="tail-assembly">
    <!-- Lightning Bolt Segments -->
    <polygon points="68,90 76,82 86,88 92,72 82,70 94,54 84,52 108,22 118,34 102,52 112,56 96,74 104,78 86,96 76,96" fill="url(#sp-tail-grad)" stroke="#854d0e" stroke-width="2" stroke-linejoin="round"/>
    <!-- Electric Sparks around Tail Tip -->
    <polygon points="112,18 116,24 122,26 116,28 112,34 110,28 104,26 110,24" fill="#fde047"/>
    <circle cx="120" cy="14" r="2" fill="#ffffff"/>
    <circle cx="94" cy="18" r="1.5" fill="#fde047"/>
  </g>

  <!-- Electric Mouse Ears -->
  <g id="ears-assembly">
    <!-- Left Ear (Pointed, black tip) -->
    <polygon points="36,40 20,8 38,18 48,34" fill="url(#sp-yellow-grad)" stroke="#a16207" stroke-width="1.8"/>
    <!-- Black Ear Tip -->
    <polygon points="20,8 28,12 24,19 19,14" fill="#0f172a"/>

    <!-- Right Ear (Pointed, black tip) -->
    <polygon points="80,34 104,12 90,26 84,40" fill="url(#sp-yellow-grad)" stroke="#a16207" stroke-width="1.8"/>
    <!-- Black Ear Tip -->
    <polygon points="104,12 96,16 99,23 105,17" fill="#0f172a"/>
  </g>

  <!-- Chubby Mouse Body -->
  <g id="body-assembly" filter="url(#sp-shadow)">
    <!-- Back Brown Fur Stripes -->
    <path d="M48 64 Q64 68 80 64" stroke="#78350f" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M46 76 Q64 80 82 76" stroke="#78350f" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Torso -->
    <ellipse cx="64" cy="82" rx="30" ry="26" fill="url(#sp-yellow-grad)" stroke="#a16207" stroke-width="2"/>

    <!-- Feet -->
    <ellipse cx="44" cy="110" rx="10" ry="6" fill="url(#sp-yellow-grad)" stroke="#a16207" stroke-width="1.8"/>
    <ellipse cx="84" cy="110" rx="10" ry="6" fill="url(#sp-yellow-grad)" stroke="#a16207" stroke-width="1.8"/>

    <!-- Cute Round Head -->
    <circle cx="64" cy="48" r="24" fill="url(#sp-yellow-grad)" stroke="#a16207" stroke-width="2"/>

    <!-- Little Paws / Hands Resting on Chest -->
    <ellipse cx="52" cy="74" rx="5" ry="4" fill="url(#sp-yellow-grad)" stroke="#a16207" stroke-width="1.5"/>
    <ellipse cx="76" cy="74" rx="5" ry="4" fill="url(#sp-yellow-grad)" stroke="#a16207" stroke-width="1.5"/>

    <!-- Radiant Red Electric Cheek Pouches -->
    <circle cx="45" cy="54" r="7" fill="#ef4444" stroke="#b91c1c" stroke-width="1.2"/>
    <circle cx="83" cy="54" r="7" fill="#ef4444" stroke="#b91c1c" stroke-width="1.2"/>

    <!-- Crackling Sparks from Cheeks -->
    <polygon points="34,52 38,50 36,54 40,53 35,56" fill="#fef08a"/>
    <polygon points="94,52 90,50 92,54 88,53 93,56" fill="#fef08a"/>

    <!-- Tiny Button Nose -->
    <ellipse cx="64" cy="46" rx="1.5" ry="1.2" fill="#0f172a"/>

    <!-- Big Anime Eyes -->
    <!-- Left Eye -->
    <circle cx="52" cy="42" r="5" fill="#0f172a"/>
    <circle cx="51" cy="40" r="2" fill="#ffffff"/>
    <circle cx="53" cy="44" r="0.8" fill="#ffffff"/>

    <!-- Right Eye -->
    <circle cx="76" cy="42" r="5" fill="#0f172a"/>
    <circle cx="75" cy="40" r="2" fill="#ffffff"/>
    <circle cx="77" cy="44" r="0.8" fill="#ffffff"/>

    <!-- Happy Open Mouth Smile -->
    <path d="M58 50 Q64 56 70 50" stroke="#78350f" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M60 51 Q64 58 68 51 Z" fill="#ef4444"/>
    <circle cx="64" cy="53" r="1.5" fill="#fca5a5"/>
  </g>
</svg>
