<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 120" width="580" height="120">
  <defs>
    <filter id="retro-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#1f251a"/>
    </filter>
    <filter id="glow-flame" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="flame-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Arcade Banner Background Plate -->
  <rect x="6" y="6" width="568" height="108" rx="18" fill="#1e293b" stroke="#f4d06f" stroke-width="4" filter="url(#retro-shadow)"/>
  <rect x="14" y="14" width="552" height="92" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <!-- Pixel Corner Highlights -->
  <rect x="18" y="18" width="6" height="6" fill="#facc15"/>
  <rect x="556" y="18" width="6" height="6" fill="#facc15"/>
  <rect x="18" y="96" width="6" height="6" fill="#facc15"/>
  <rect x="556" y="96" width="6" height="6" fill="#facc15"/>

  <!-- Left: Cute Flamechar Mascot Mini-Portrait -->
  <g transform="translate(24, 20)">
    <!-- Mascot Halo/Glow -->
    <circle cx="40" cy="40" r="34" fill="#3b1f1f" stroke="#ef4444" stroke-width="2.5"/>
    <circle cx="40" cy="40" r="28" fill="#f97316" filter="url(#glow-flame)"/>
    <!-- Head / Face -->
    <path d="M22 45 C22 28 32 20 40 20 C48 20 58 28 58 45 C58 56 50 62 40 62 C30 62 22 56 22 45 Z" fill="#fb923c"/>
    <!-- Cute Eyes -->
    <ellipse cx="33" cy="38" rx="4.5" ry="6" fill="#0f172a"/>
    <ellipse cx="47" cy="38" rx="4.5" ry="6" fill="#0f172a"/>
    <circle cx="34.5" cy="36" r="2" fill="#ffffff"/>
    <circle cx="48.5" cy="36" r="2" fill="#ffffff"/>
    <!-- Cute Cheeks -->
    <circle cx="28" cy="46" r="3" fill="#ef4444" opacity="0.8"/>
    <circle cx="52" cy="46" r="3" fill="#ef4444" opacity="0.8"/>
    <!-- Happy Smile -->
    <path d="M37 46 Q40 50 43 46" stroke="#431407" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Flame on Top/Ear -->
    <path d="M38 18 Q40 6 46 10 Q42 16 46 18 Q42 19 38 18 Z" fill="url(#flame-grad)" filter="url(#glow-flame)"/>
  </g>

  <!-- Center Text: CATCH THAT PIP! -->
  <g transform="translate(118, 20)">
    <!-- Subtitle Banner -->
    <rect x="0" y="4" width="160" height="18" rx="4" fill="#dc2626"/>
    <text x="80" y="17" font-family="'Space Mono', monospace, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">DEV ADVENTURE</text>

    <!-- Main Title "CATCH THAT PIP!" -->
    <text x="3" y="58" font-family="'VT323', 'Outfit', sans-serif" font-size="38" font-weight="900" fill="#991b1b" letter-spacing="2">CATCH THAT PIP!</text>
    <text x="0" y="55" font-family="'VT323', 'Outfit', sans-serif" font-size="38" font-weight="900" fill="url(#text-grad)" stroke="#1f251a" stroke-width="2" letter-spacing="2">CATCH THAT PIP!</text>

    <!-- Bottom Tagline -->
    <text x="2" y="75" font-family="'Space Mono', monospace, sans-serif" font-size="9" font-weight="700" fill="#a3e635" letter-spacing="1">★ FLAMECHAR &amp; GLITCH MONSTERS ★</text>
  </g>

  <!-- Right: Pip-Capsule Icon -->
  <g transform="translate(485, 25)">
    <!-- Capsule Sphere -->
    <circle cx="35" cy="35" r="28" fill="#ffffff" stroke="#1e293b" stroke-width="3" filter="url(#retro-shadow)"/>
    <!-- Top Red Half -->
    <path d="M7 35 A28 28 0 0 1 63 35 Z" fill="#ef4444"/>
    <!-- Center Band -->
    <rect x="7" y="32" width="56" height="6" fill="#1e293b"/>
    <!-- Center Button -->
    <circle cx="35" cy="35" r="10" fill="#1e293b"/>
    <circle cx="35" cy="35" r="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="2.5" fill="#facc15"/>
    <!-- Capsule Sparkles -->
    <polygon points="12,12 14,16 18,18 14,20 12,24 10,20 6,18 10,16" fill="#fde047"/>
    <circle cx="62" cy="55" r="2" fill="#38bdf8"/>
  </g>
</svg>
