<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart Page</title>
  <link rel="stylesheet" href="cart.css">
</head>
<body>
  <div class="cart-container">
    <h2>Shopping Cart</h2>
    
    <div class="cart-wrapper">
      <!-- Cart Items -->
      <div class="cart-items">
        <div class="item">
          <img src="/images/clothes/top1.jpg" alt="Product 1">
          <div class="item-details">
            <h3>cute top 1</h3>
            <p>Price: ₹699</p>
            <div class="quantity">
              <button>-</button>
              <input type="text" value="1" />
              <button>+</button>
            </div>
            <p>Total: ₹499</p>
          </div>
        </div>

        <div class="item">
          <img src="images/clothes/top2.jpg" alt="Product 2">
          <div class="item-details">
            <h3>cute top 2</h3>
            <p>Price: ₹799</p>
            <div class="quantity">
              <button>-</button>
              <input type="text" value="2" />
              <button>+</button>
            </div>
            <p>Total: ₹1398</p>
          </div>
        </div>
      </div>

      <!-- Cart Summary -->
      <div class="cart-summary">
        <h3>Order Summary</h3>
        <p>Items: ₹1398</p>
        <p>Shipping: ₹100</p>
        <hr />
        <h4>Total: ₹1498</h4>
        <button>Proceed to Checkout</button>
      </div>
    </div>
  </div>
</body>
</html>
