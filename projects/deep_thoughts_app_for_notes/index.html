<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deep Thoughts — Minimalist Markdown Notes</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Marked.js for Markdown Parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg-main: #fff5f7;
      --bg-sidebar: #fbebf0;
      --bg-card: #ffffff;
      --pink-primary: #e63956;
      --pink-hover: #d02e49;
      --pink-soft: #f472b6;
      --pink-light: #fce7f3;
      --text-main: #2d1a24;
      --text-muted: #8a6b79;
      --border-color: #f3d0d7;
      --shadow: 0 4px 20px -2px rgba(230, 57, 86, 0.08);
      --shadow-hover: 0 10px 25px -5px rgba(230, 57, 86, 0.12);
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-title: 'Playfair Display', serif;
      --font-mono: 'Fira Code', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar Styling */
    aside {
      width: 280px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
      z-index: 10;
    }

    .brand {
      padding: 24px 20px 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand h1 {
      font-family: var(--font-title);
      font-size: 1.5rem;
      color: var(--pink-primary);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-new {
      margin: 0 20px 16px 20px;
      background-color: var(--pink-primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
    }

    .btn-new:hover {
      background-color: var(--pink-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow-hover);
    }

    .notes-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 12px;
    }

    .note-item {
      padding: 14px 16px;
      border-radius: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      background-color: transparent;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .note-item:hover {
      background-color: rgba(255, 255, 255, 0.6);
    }

    .note-item.active {
      background-color: var(--bg-card);
      box-shadow: var(--shadow);
    }

    .note-info {
      overflow: hidden;
    }

    .note-title {
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-main);
    }

    .note-date {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .btn-delete {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s ease, color 0.2s ease;
      padding: 4px 8px;
    }

    .note-item:hover .btn-delete {
      opacity: 1;
    }

    .btn-delete:hover {
      color: var(--pink-primary);
    }

    /* Main Content Area */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Header Bar */
    header {
      height: 64px;
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .title-input {
      font-family: var(--font-title);
      font-size: 1.4rem;
      border: none;
      outline: none;
      color: var(--text-main);
      background: transparent;
      width: 50%;
      font-weight: 600;
    }

    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn-action {
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-action:hover {
      background-color: var(--pink-light);
      color: var(--pink-primary);
      border-color: var(--pink-soft);
    }

    /* Workspace Split Area */
    .workspace {
      flex: 1;
      display: flex;
      height: calc(100vh - 64px - 32px);
      overflow: hidden;
    }

    .editor-pane, .preview-pane {
      flex: 1;
      height: 100%;
      overflow-y: auto;
      padding: 24px;
    }

    .editor-pane {
      border-right: 1px solid var(--border-color);
      background-color: #ffffff;
    }

    textarea {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      resize: none;
      font-family: var(--font-mono);
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-main);
      background: transparent;
    }

    .preview-pane {
      background-color: var(--bg-main);
    }

    /* Markdown Rendered Styles */
    .preview-content {
      line-height: 1.7;
      color: var(--text-main);
    }

    .preview-content h1, 
    .preview-content h2, 
    .preview-content h3 {
      font-family: var(--font-title);
      color: var(--pink-primary);
      margin-top: 1.2em;
      margin-bottom: 0.6em;
    }

    .preview-content h1 { font-size: 1.8rem; border-bottom: 2px solid var(--pink-light); padding-bottom: 6px; }
    .preview-content h2 { font-size: 1.4rem; }
    .preview-content h3 { font-size: 1.1rem; }

    .preview-content p { margin-bottom: 1em; }

    .preview-content blockquote {
      border-left: 4px solid var(--pink-soft);
      padding-left: 16px;
      margin: 1em 0;
      color: var(--text-muted);
      font-style: italic;
      background: var(--pink-light);
      padding: 10px 16px;
      border-radius: 0 8px 8px 0;
    }

    .preview-content code {
      font-family: var(--font-mono);
      background: var(--pink-light);
      color: var(--pink-primary);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.85em;
    }

    .preview-content pre code {
      display: block;
      padding: 14px;
      overflow-x: auto;
      border-radius: 8px;
      background: #2d1a24;
      color: #fce7f3;
    }

    .preview-content ul, .preview-content ol {
      padding-left: 20px;
      margin-bottom: 1em;
    }

    .preview-content a {
      color: var(--pink-primary);
      text-decoration: underline;
    }

    /* Footer / Status Bar */
    footer {
      height: 32px;
      background-color: var(--bg-card);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside>
    <div class="brand">
      <h1><i class="fa-solid fa-heart"></i> Deep Thoughts</h1>
    </div>
    <button class="btn-new" id="newNoteBtn">
      <i class="fa-solid fa-plus"></i> New Thought
    </button>
    <div class="notes-list" id="notesList"></div>
  </aside>

  <!-- Main View -->
  <main>
    <header>
      <input type="text" class="title-input" id="noteTitle" placeholder="Untitled Thought...">
      <div class="actions">
        <button class="btn-action" id="copyMarkdownBtn">
          <i class="fa-regular fa-copy"></i> Copy Markdown
        </button>
        <button class="btn-action" id="exportBtn">
          <i class="fa-solid fa-download"></i> Export
        </button>
      </div>
    </header>

    <div class="workspace">
      <div class="editor-pane">
        <textarea id="markdownEditor" placeholder="Write your deep thoughts here in Markdown..."></textarea>
      </div>
      <div class="preview-pane">
        <div class="preview-content" id="markdownPreview"></div>
      </div>
    </div>

    <footer>
      <span id="saveStatus">Saved to LocalStorage</span>
      <span id="wordCount">0 words | 0 characters</span>
    </footer>
  </main>

  <script>
    const STORAGE_KEY = 'deep_thoughts_notes';
    let notes = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let activeNoteId = null;

    // DOM Elements
    const notesListEl = document.getElementById('notesList');
    const newNoteBtn = document.getElementById('newNoteBtn');
    const noteTitleInput = document.getElementById('noteTitle');
    const markdownEditor = document.getElementById('markdownEditor');
    const markdownPreview = document.getElementById('markdownPreview');
    const wordCountEl = document.getElementById('wordCount');
    const saveStatusEl = document.getElementById('saveStatus');
    const copyMarkdownBtn = document.getElementById('copyMarkdownBtn');
    const exportBtn = document.getElementById('exportBtn');

    // Initialize App
    function init() {
      if (notes.length === 0) {
        createNewNote("Welcome to Deep Thoughts 💭", "# Welcome to Deep Thoughts\n\nWrite your thoughts down on the left, and watch them bloom into a beautifully styled document on the right.\n\n### Features:\n- **Minimalist Aesthetic**: Soft Pinterest-inspired pink palette.\n- **Real-time Live Preview**: Powered by `Marked.js`.\n- **Local Storage**: Auto-saves instantly.\n\n> *\"Thoughts become things. Write them down.\"*");
      } else {
        activeNoteId = notes[0].id;
        renderSidebar();
        loadActiveNote();
      }
    }

    // Save Notes to LocalStorage
    function saveToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
      saveStatusEl.textContent = 'Saved to LocalStorage';
    }

    // Render Sidebar Items
    function renderSidebar() {
      notesListEl.innerHTML = '';
      notes.forEach(note => {
        const item = document.createElement('div');
        item.className = `note-item ${note.id === activeNoteId ? 'active' : ''}`;
        item.onclick = () => switchNote(note.id);

        const dateFormatted = new Date(note.updatedAt).toLocaleDateString(undefined, {
          month: 'short',
          day: 'numeric'
        });

        item.innerHTML = `
          <div class="note-info">
            <div class="note-title">${note.title || 'Untitled Thought'}</div>
            <div class="note-date">${dateFormatted}</div>
          </div>
          <button class="btn-delete" onclick="deleteNote(event, '${note.id}')" title="Delete">
            <i class="fa-regular fa-trash-can"></i>
          </button>
        `;
        notesListEl.appendChild(item);
      });
    }

    // Load Active Note into Editor
    function loadActiveNote() {
      const activeNote = notes.find(n => n.id === activeNoteId);
      if (!activeNote) return;

      noteTitleInput.value = activeNote.title;
      markdownEditor.value = activeNote.content;
      updatePreview();
    }

    // Switch Active Note
    function switchNote(id) {
      activeNoteId = id;
      renderSidebar();
      loadActiveNote();
    }

    // Create New Note
    function createNewNote(title = '', content = '') {
      const newNote = {
        id: Date.now().toString(),
        title: title,
        content: content,
        updatedAt: new Date().toISOString()
      };
      notes.unshift(newNote);
      activeNoteId = newNote.id;
      saveToStorage();
      renderSidebar();
      loadActiveNote();
    }

    // Delete Note
    function deleteNote(event, id) {
      event.stopPropagation();
      notes = notes.filter(n => n.id !== id);
      if (activeNoteId === id) {
        activeNoteId = notes.length > 0 ? notes[0].id : null;
      }
      saveToStorage();
      if (!activeNoteId && notes.length === 0) {
        createNewNote();
      } else {
        renderSidebar();
        loadActiveNote();
      }
    }

    // Update Live HTML Preview and Stats
    function updatePreview() {
      const content = markdownEditor.value;
      markdownPreview.innerHTML = marked.parse(content);

      // Word & Character Count
      const words = content.trim() ? content.trim().split(/\s+/).length : 0;
      const chars = content.length;
      wordCountEl.textContent = `${words} words | ${chars} characters`;

      // Update Active Note Data
      const activeNote = notes.find(n => n.id === activeNoteId);
      if (activeNote) {
        activeNote.content = content;
        activeNote.title = noteTitleInput.value;
        activeNote.updatedAt = new Date().toISOString();
        saveStatusEl.textContent = 'Unsaved changes...';
        debounceSave();
      }
    }

    // Debounce Auto-Save
    let timeout = null;
    function debounceSave() {
      clearTimeout(timeout);
      timeout = setTimeout(() => {
        saveToStorage();
        renderSidebar();
      }, 500);
    }

    // Event Listeners
    markdownEditor.addEventListener('input', updatePreview);
    noteTitleInput.addEventListener('input', updatePreview);

    newNoteBtn.addEventListener('click', () => createNewNote());

    copyMarkdownBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(markdownEditor.value);
      alert('Markdown copied to clipboard!');
    });

    exportBtn.addEventListener('click', () => {
      const activeNote = notes.find(n => n.id === activeNoteId);
      const blob = new Blob([markdownEditor.value], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${activeNote.title || 'thought'}.md`;
      a.click();
      URL.revokeObjectURL(url);
    });

    // Run Application
    init();
  </script>
</body>
</html>
